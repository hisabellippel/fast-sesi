<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <source src="login.js" type="">
    

   
</head>
<body>
    <header>
        <div id="barraescura">
            <img class="topo1" src="imagens/flecha-removebg-preview.png" alt="">
            <img class="topo2" src="imagens/tradutorr-removebg-preview.png" alt="">
        </div>
    </header>
<main>
    <img class="imgtopo" src="imagens/Captura de tela 2025-04-10 093407.png" alt="">  
    <div class="branca">

        <img class="i" src="imagens/2-removebg-preview.png" alt="">
        <form action="usuario"id = "gerenteForm"></form>

        <div class="c1">
        <label for="nome"></label><br>
        <img class="im" src="imagens/2-removebg-preview.png" alt="">
        <input type="text" name="nome"id = "nome" value=""  placeholder="Insira seu nome:" required>
        </div>

        <br>

        <div class="c2">
        <label for="credencial"></label><br>
        <img class="im" src="imagens/1-removebg-preview.png" alt="">
        <input type="text" name="credencial"id = "credencial" value="" placeholder="Insira sua credencial:" required> 
        </div>

        <br>

        <div class="c3">
        <label for="senha"></label><br>
        <img class="im" src="imagens/3-removebg-preview.png" alt="">
        <input type="password" name="senha"id = "senha" value="" placeholder="Insira sua senha:" required> 
        </div>

        <br>

        <div class="c4">
        <label for="OTP"></label><br>
        <img class="im" src="imagens/4-removebg-preview.png" alt="">
        <input type="number" name="OTP"id = "OTP" value="" placeholder="Insira o OTP:"required> 
        </div>

        <br>
        <a href="">Não tem uma conta? Clique aqui!</a>
        <br>
        <button type="button" onclick="validarLogin()">Entrar</button>
    </div>

    <footer>
        <div>
            <img class="imagembase" src="imagens/__SA_Parte_I__-removebg-preview.png" alt="">
        </div>
    </footer>
</main>
    
</body>
</html>

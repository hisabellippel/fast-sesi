<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/styles.css">
    <source src="login.js" type="">
    

   
</head>
<body>
    <header>
        <div id="barraescura">
            <img class="topo1" src="../asets/imagens/barraAcima/flecha.png" alt="">
            <img class="topo2" src="../asets/imagens/barraAcima/tradutor.png" alt="">
        </div>
    </header>
<main>
    <img class="imgtopo" src="../asets/imagens/meio/fotoFundoTrem.png" alt="">  
    <div class="branca">

        <img class="i" src="../asets/imagens/meio/perfil.png" alt="">
        <form action="usuario"id = "gerenteForm"></form>

        <div class="c1">
        <label for="nome"></label><br>
        <img class="im" src="../asets/imagens/meio/nome.png" alt="">
        <input type="text" name="nome"id = "nome" value=""  placeholder="Insira seu nome:" required>
        </div>

        <br>

        <div class="c2">
        <label for="credencial"></label><br>
        <img class="im" src="../asets/imagens/meio/credencial.png" alt="">
        <input type="text" name="credencial"id = "credencial" value="" placeholder="Insira sua credencial:" required> 
        </div>

        <br>

        <div class="c3">
        <label for="senha"></label><br>
        <img class="im" src="../asets/imagens/meio/senha.png" alt="">
        <input type="password" name="senha"id = "senha" value="" placeholder="Insira sua senha:" required> 
        </div>

        <br>

        <div class="c4">
        <label for="OTP"></label><br>
        <img class="im" src="../asets/imagens/meio/otp.png" alt="">
        <input type="number" name="OTP"id = "OTP" value="" placeholder="Insira o OTP:"required> 
        </div>

        <br>
        <a href="pagina4.html">Não tem uma conta? Clique aqui!</a>
        <br>
        <button type="button" onclick="validarLogin()">Entrar</button>
    </div>

    <footer>
        <div>
            <img class="imagembase" src="../asets/imagens/barraAbaixo/logo.png" alt="">
        </div>
    </footer>
</main>
    
</body>
</html>

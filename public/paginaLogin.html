<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style/styles.css">
    <script src="../scripts/login.js"></script>
    

   
</head>
<body>
    <header>
        <div id="barraescura">
            <div  id="nav-itens">
                 <a href="paginaCriarConta.html"><img class="topo1" src="../asets/imagens/barraAcima/flecha.png" alt=""></a>
                <img class="topo2" src="../asets/imagens/barraAcima/tradutor.png" alt="">
            </div>
            <img class="imgtopo" src="../asets/imagens/meio/fotoFundoTrem.png" alt="">
        </div>
    </header>
    <main>
    <div class="branca1">

        <img class="i" src="../asets/imagens/meio/perfil.png" alt="">
        <form id="seuFormulario">

            <div class="c2">
            <label for="nome"></label><br>
            <img class="im" src="../asets/imagens/meio/nome.png" alt="">
            <input type="text" name="nome" id = "nome" placeholder="Insira seu nome:" required>
            <div class="error" id="erroNome"></div>
            </div>

            <br>

            <div class="c2">
                <label for="credencial"></label><br>
                <img class="im" src="../asets/imagens/meio/credencial.png" alt="">
                <input type="text" name="credencial"id = "credencial" placeholder="Insira sua credencial:" required>
                <div class="error" id="erroCredencial"></div> 
            </div>

            <br>

            <div class="c2">
                <label for="senha"></label><br>
                <img class="im" src="../asets/imagens/meio/senha.png" alt="">
                <input type="password" name="senha" id = "senha" placeholder="Insira sua senha:" required> 
                <div class="error" id="erroSenha"></div>
            </div>

            <br>

            <div class="c2">
                <label for="otp"></label><br>
                <img class="im" src="../asets/imagens/meio/otp.png" alt="">
                <input type="number" name="otp" id = "otp" placeholder="Insira o OTP:"required> 
                <div class="error" id="erroOTP"></div>
            </div>

            <br>
            <a href="paginaCriarConta.html">Não tem uma conta? Clique aqui!</a>
            <br>
            <button type="submit">Entrar</button>
        </form>
    </div>


    <footer>
          <div id="barra">
            <a href="paginainformacoes.html"><img class="topo1" src="../asets/imagens/barraAbaixo/barras.png" alt=""></a>
            <img class="im" src="../asets/imagens/barraAbaixo/logo.png" alt="">
            <h2>Fast.sesi</h2>
            <a href="paginaNotificacoes.html"><img class="im2" src="../asets/imagens/barraAbaixo/sinoNotificacao.png" alt=""></a>
            <a href="paginaAlterarPerfil.html"><img class="im3" src="../asets/imagens/barraAbaixo/pessoa.png" alt=""></a>
            <a href="paginaPesquisar.html"><img class="im4" src="../asets/imagens/barraAbaixo/Lupa1.png" alt=""></a>
        </div>
    </footer>
</main>
    
</body>
</html>

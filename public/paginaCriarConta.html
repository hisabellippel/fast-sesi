<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/styles.css">
    <script src="../scripts/cadastro.js"></script>


</head>

<body>
    <header>
        <div id="barraescura">
            <img class="topo1" src="../asets/imagens/barraAcima/Flecha.png" alt="">
            <img class="topo2" src="../asets/imagens/barraAcima/tradutor.png" alt="">
            <img class="imgtopo" src="../asets/imagens/meio/fotoFundoTrem.png" alt="">
        </div>
    </header>
    <main>
        <div class="branca1">

            <img class="i" src="../asets/imagens/meio/perfil.png" alt="">
            <form id="meuFormulario">

                <div class="c1">
                    <label for="nome"></label><br>
                    <img class="imag" src="../asets/imagens/meio/nome.png" alt="">
                    <input type="text" name="nome" id="nome" placeholder="Insira seu nome:" required>
                    <div class="error" id="erroNome"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="cpf"></label><br>
                    <img class="imag" src="../asets/imagens/meio/cpf.png" alt="">
                    <input type="number" name="cpf" id="cpf" placeholder="Insira seu CPF:" required>
                    <div class="error" id="erroCPF"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="email"></label><br>
                    <img class="imag" src="../asets/imagens/meio/email.png" alt="">
                    <input type="email" name="email" id="email" placeholder="Insira seu e-mail:" required>
                    <div class="error" id="erroEmail"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="email"></label><br>
                    <img class="imag" src="../asets/imagens/meio/email.png" alt="">
                    <input type="email" name="email" id="email" placeholder="Confirme seu e-mail:" required>
                    <div class="error" id="erroEmail"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="dn"></label><br>
                    <img class="imag" src="../asets/imagens/meio/data.png" alt="">
                    <input type="date" name="dn" id="dn" placeholder="Insira sua data de nascimento:" required>
                    <div class="error" id="erroDN"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="otp"></label><br>
                    <img class="imag" src="../asets/imagens/meio/otp.png" alt="">
                    <input type="number" name="otp" id="otp" placeholder="Insira o OTP:" required>
                    <div class="error" id="erroOTP"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="tel"></label><br>
                    <img class="imag" src="../asets/imagens/meio/telefone.png" alt="">
                    <input type="tel" name="tel" id="tel" placeholder="Insira seu telefone:" required>
                    <div class="error" id="erroTel"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="senha"></label><br>
                    <img class="imag" src="../asets/imagens/meio/senha.png" alt="">
                    <input type="password" name="senha" id="senha" placeholder="Insira sua senha:" required>
                    <div class="error" id="erroSenha"></div>
                </div>

                <br>

                <div class="c1">
                    <label for="senha"></label><br>
                    <img class="imag" src="../asets/imagens/meio/senha.png" alt="">
                    <input type="password" name="senha" id="senha" placeholder="Confirme sua senha:" required>
                    <div class="error" id="erroSenha"></div>
                </div>


                <br>
                <button type="submit">Criar conta</button>

            </form>
        </div>

        <footer>
            <div id="barra">
                <img class="topo1" src="../asets/imagens/barraAbaixo/barras.png" alt="">
                <img class="im" src="../asets/imagens/barraAbaixo/logo.png" alt="">
                <h2>Fast.sesi</h2>
                <img class="im2" src="../asets/imagens/barraAbaixo/sinoNotificacao.png" alt="">
                <img class="im3" src="../asets/imagens/barraAbaixo/pessoa.png" alt="">
                <img class="im4" src="../asets/imagens/barraAbaixo/Lupa1.png" alt="">
            </div>
        </footer>
    </main>

</body>

</html>
